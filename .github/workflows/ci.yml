# PrepSathi mobile — CI
#
# On every push / pull request: typecheck + lint + Jest.
# On every push: build an Android debug APK (no signing keys needed;
# Samir installs it directly on his Galaxy A24).
# On a version tag (v*): attach the debug APK to a GitHub release.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --no-coverage --runInBand

  build-android:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already ships an Android SDK (ANDROID_HOME is set).
      # Do NOT use android-actions/setup-android@v3: it runs `sdkmanager tools`
      # and the `tools` package no longer exists in Google's SDK repository,
      # so the step fails with "Failed to find package 'tools'" (run 43899834228).
      # Install exactly what the project needs instead.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;37.0.0" "ndk;27.1.12297006"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prepsathi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
